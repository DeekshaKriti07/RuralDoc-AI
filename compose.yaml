services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ruraldoc
      DB_USER: ruraldoc
      OLLAMA_BASE_URL: http://ollama:11434
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ruraldoc
      MYSQL_USER: ruraldoc
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      TZ: Asia/Kolkata
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: ["ollama_data:/root/.ollama"]
volumes:
  mysql_data:
  ollama_data:
